<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القسم - نظام إدارة المستفيدين</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>نظام إدارة المستفيدين من ذوي الإعاقة</h1>
    <button id="logout-btn" class="btn-secondary">تسجيل الخروج</button>
  </header>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="page-title">
      <div>
        <a href="dashboard.html">&#8594; رجوع للوحة التحكم</a>
        <h2 id="dept-name" style="margin:6px 0 0;">القسم</h2>
      </div>
      <button id="add-btn">إضافة مستفيد</button>
    </div>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-box" placeholder="بحث بالاسم أو رقم الملف أو الرقم القومي">
      <button id="search-btn" class="btn-secondary">بحث</button>
    </div>

    <div id="loading" class="empty-state">جاري التحميل...</div>

    <div class="table-wrap" id="table-wrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>رقم الملف</th>
            <th>الاسم الكامل</th>
            <th>الرقم القومي</th>
            <th>النوع</th>
            <th>تاريخ الميلاد</th>
            <th>نوع الإعاقة</th>
            <th>الهاتف</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div id="empty-state" class="empty-state" style="display:none;">لا يوجد مستفيدون</div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-backdrop" id="delete-modal">
    <div class="modal-box">
      <h3>تأكيد الحذف</h3>
      <p>هل أنت متأكد من حذف هذا المستفيد؟ لا يمكن التراجع عن هذا الإجراء.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-delete">إلغاء</button>
        <button class="btn-danger" id="confirm-delete">حذف</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/department.js"></script>
</body>
</html>
