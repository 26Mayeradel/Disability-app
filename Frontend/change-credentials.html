<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تغيير بيانات الدخول - نظام إدارة المستفيدين</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>نظام إدارة المستفيدين من ذوي الإعاقة</h1>
    <button id="logout-btn" class="btn-secondary">تسجيل الخروج</button>
  </header>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="page-title">
      <h2>تغيير بيانات الدخول</h2>
    </div>

    <form id="credentials-form" class="card" style="max-width:420px;">
      <div class="field" id="field-currentPassword">
        <label for="currentPassword">كلمة المرور الحالية <span class="required-mark">*</span></label>
        <input type="password" id="currentPassword" autocomplete="current-password">
        <div class="error"></div>
      </div>
      <div class="field" id="field-newUsername">
        <label for="newUsername">اسم المستخدم الجديد <span class="required-mark">*</span></label>
        <input type="text" id="newUsername" autocomplete="username">
        <div class="error"></div>
      </div>
      <div class="field" id="field-newPassword">
        <label for="newPassword">كلمة المرور الجديدة <span class="required-mark">*</span></label>
        <input type="password" id="newPassword" autocomplete="new-password">
        <div class="error"></div>
      </div>
      <div class="field" id="field-confirmNewPassword">
        <label for="confirmNewPassword">تأكيد كلمة المرور الجديدة <span class="required-mark">*</span></label>
        <input type="password" id="confirmNewPassword" autocomplete="new-password">
        <div class="error"></div>
      </div>

      <div class="form-actions">
        <button type="submit" id="save-btn">حفظ التغييرات</button>
        <button type="button" class="btn-secondary" id="cancel-btn">إلغاء</button>
      </div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/credentials.js"></script>
</body>
</html>
