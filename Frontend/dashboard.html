<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - نظام إدارة المستفيدين</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>نظام إدارة المستفيدين من ذوي الإعاقة</h1>
    <button id="logout-btn" class="btn-secondary">تسجيل الخروج</button>
  </header>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div id="loading" class="empty-state">جاري التحميل...</div>

    <div id="content" style="display:none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="value" id="stat-total">0</div>
          <div class="label">إجمالي المستفيدين</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-male">0</div>
          <div class="label">ذكور</div>
        </div>
        <div class="stat-card">
          <div class="value" id="stat-female">0</div>
          <div class="label">إناث</div>
        </div>
      </div>

      <h2>الأقسام</h2>
      <div class="dept-grid" id="dept-grid"></div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
